name: Build GTK4 App

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out code from repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install GTK4, Libadwaita development libraries, and GCC compiler
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev gcc pkg-config

      # 3. Compile the application
      - name: Compile
        run: |
          gcc -Wall -O2 -o debloater app.c $(pkg-config --cflags --libs libadwaita-1)

      # 4. Upload build binary as an artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debloat-app-linux
          path: debloater
